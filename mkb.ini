; Fallout: Brotherhood of Steel - mouse and keyboard controls.
; Used when Settings > Controls is "Mouse and keyboard". Edit freely:
;   <input> = <pad button>[+<pad button>...]
; Inputs:  A..Z, 0..9, F1..F12, Space, Enter, Esc, Tab, Backspace, Shift,
;          Ctrl, Alt, Up, Down, Left, Right, Mouse1 (left), Mouse2 (right),
;          Mouse3 (middle), Mouse4, Mouse5 (side buttons), WheelUp, WheelDown
; Pad:     a b x y white black lt rt start back lthumb rthumb
;          dup ddown dleft dright  lup ldown lleft lright
;          rup rdown rleft rright  walk
; The game's own default pad layout (Options > Controls):
;   A attack, B special attack, X action (talk/open), Y jump/dodge,
;   left trigger stimpak, right trigger target lock, white/black next/previous
;   weapon, d-pad down crouch, d-pad left/right map mode, Back inventory,
;   Start pause, left stick move, right stick camera.
; F9 releases the mouse (and captures it again).

[Mouse]
; Hold the middle button and move the mouse to turn the camera.
mouse = drag
drag_button = Mouse3
; Mouse counts per frame for the fastest turn: higher = slower.
full = 12

[Move]
W = lup
S = ldown
A = lleft
D = lright
Up = dup
Down = ddown
Left = dleft
Right = dright
; Hold to walk instead of run.
Shift = walk
walk = 0.45

[Fight]
Mouse1 = a
; Hold to lock on to a target (and dodge with Space while held).
Mouse2 = rt
F = b
Mouse4 = b
Space = y
Q = lt
WheelUp = white
WheelDown = black
R = white
C = ddown
Ctrl = ddown

[World]
E = x
Z = rleft
X = rright
M = dleft
N = dright
Tab = back
I = back
Esc = start

[Menus]
Enter = a
Backspace = b
